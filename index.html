<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Ulang Tahun Mas Rizky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#000; --muted:#5c5c5c; --line:#000; --shadow:#000; --paper:#fff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --ink:#fff; --muted:#a8a8a8; --line:#fff; --shadow:#5a5a5a; --paper:#fff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --ink:#fff; --muted:#a8a8a8; --line:#fff; --shadow:#5a5a5a; --paper:#fff;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6;font-size:17px;text-align:center}
main{max-width:560px;margin:0 auto;padding:48px 24px 80px}

.polaroid{width:min(78vw,340px);margin:0 auto 40px;background:var(--paper);padding:14px;border:1.5px solid var(--line);border-radius:6px;box-shadow:7px 7px 0 var(--shadow);transform:rotate(-3deg);animation:drop .9s cubic-bezier(.2,.8,.2,1) both}
.polaroid img{display:block;width:100%;height:auto}
.polaroid figcaption{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.35rem;color:#000;padding-top:10px}
@keyframes drop{from{transform:translateY(-60px) rotate(6deg);opacity:0}to{transform:translateY(0) rotate(-3deg);opacity:1}}

.lead{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.35rem;margin:0 0 8px;color:var(--muted)}
h1{white-space:pre-line;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(2.4rem,10vw,3.8rem);line-height:1.05;margin:0 0 20px;letter-spacing:-0.01em}
.msg{color:var(--muted);margin:0 auto 40px;max-width:44ch;white-space:pre-line}

dl{margin:0 0 40px;text-align:left;border-top:1.5px dashed var(--line)}
.row{display:flex;gap:16px;padding:16px 4px;border-bottom:1.5px dashed var(--line)}
dt{flex:0 0 92px;color:var(--muted)}
dd{margin:0;font-weight:500}

.count{display:flex;gap:10px;margin:0 0 44px}
.count div{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:14px 4px}
.count b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.2rem;line-height:1.1}
.count span{font-size:.85rem;color:var(--muted)}

.rsvp{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
button{font:inherit;font-weight:500;border-radius:999px;padding:14px 26px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button.yes{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#reply{min-height:3em;margin:24px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.35rem}

.heart{position:fixed;bottom:-30px;font-size:28px;line-height:1;color:var(--ink);pointer-events:none;animation:up 2.6s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.heart{display:none}.polaroid{animation:none;transform:rotate(-3deg)}}
</style>
</head>

    <div class="row"><dt>Kapan</dt><dd id="d-date"></dd></div>
    <div class="row"><dt>Jam</dt><dd id="d-time"></dd></div>
    <div class="row"><dt>Dimana</dt><dd id="d-place"></dd></div>
    <div class="row"><dt>Pakaian</dt><dd id="d-dress"></dd></div>
  </dl>

  <div class="count" id="count">
    <div><b id="c-d">0</b><span>hari</span></div>
    <div><b id="c-h">0</b><span>jam</span></div>
    <div><b id="c-m">0</b><span>menit</span></div>
    <div><b id="c-s">0</b><span>detik</span></div>
  </div>

  <div class="rsvp">
    <button class="yes" id="yes">Aku datang ♡</button>
    <button id="maybe">Aku mikir dulu</button>
  </div>
  <p id="reply" role="status"></p>
</main>

<script>
// Ganti bagian ini dengan detail aslinya
var CFG = {
  nama: "Mas Rizky",
  umur: 27,
  pesan: "Dear sayang calon suamiku,\nLet’s celebrate your special day with me, and us.",
  tanggal: "2026-12-12T00:00:00",
  tanggalText: "Sabtu, 12 Desember 2026",
  jam: "00.00 WIB, pas pergantian hari",
  tempat: "Sky Home",
  dress: "Kemeja maroon yang baru yaaa~ Tolong wajib ganti baju dulu abis pulang kerja!!"
};
function $(id){return document.getElementById(id)}
$("title").textContent = "Happy birthday,\nmy favorite person";
$("msg").textContent = CFG.pesan;
$("d-date").textContent = CFG.tanggalText;
$("d-time").textContent = CFG.jam;
$("d-place").textContent = CFG.tempat;
$("d-dress").textContent = CFG.dress;

function tick(){
  var diff = Math.max(0, new Date(CFG.tanggal) - new Date());
  $("c-d").textContent = Math.floor(diff/864e5);
  $("c-h").textContent = Math.floor(diff%864e5/36e5);
  $("c-m").textContent = Math.floor(diff%36e5/6e4);
  $("c-s").textContent = Math.floor(diff%6e4/1e3);
}
tick(); setInterval(tick,1000);

function hearts(){
  var set = ["♡","♥","✦"];
  for(var i=0;i<14;i++){
    var h = document.createElement("span");
    h.className = "heart";
    h.textContent = set[i%set.length];
    h.style.left = (Math.random()*92)+"%";
    h.style.animationDelay = (Math.random()*0.8)+"s";
    document.body.appendChild(h);
    setTimeout(function(el){el.remove()}, 3600, h);
  }
}
$("yes").addEventListener("click", function(){
  $("reply").textContent = "Yeay, ditunggu ya Mas! Jangan lupa kemejanya.";
  hearts();
});
$("maybe").addEventListener("click", function(){
  $("reply").textContent = "Mikirnya jangan lama-lama ya, Mas. Aku nagih lho, hehe.";
});
</script>
</body>
</html>
